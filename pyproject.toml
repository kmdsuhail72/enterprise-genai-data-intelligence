# =============================================================================
# Enterprise GenAI Data Intelligence Platform
# =============================================================================
# Modern Python project configuration using PEP 621

[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-genai-platform"
version = "0.1.0"
description = "Enterprise-grade GenAI Data Intelligence Platform with multi-modal RAG, PII detection, and agentic analytics"
readme = "README.md"
license = { text = "Proprietary" }
requires-python = ">=3.11"
authors = [
    { name = "Enterprise GenAI Team" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.12",

    # --- Data Validation & Settings ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "email-validator>=2.0.0",

    # --- Database & ORM ---
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.5",

    # --- Logging ---
    "structlog>=24.4.0",

    # --- HTTP Client ---
    "httpx>=0.27.0",

    # --- Authentication ---
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # --- Document Processing ---
    "pymupdf>=1.24.0",
    "openpyxl>=3.1.5",
    "python-docx>=1.1.0",
    "Pillow>=10.4.0",

    # --- Data Analysis ---
    "pandas>=2.2.0",
    "numpy>=1.26.0",

    # --- Cloud & LLM Providers ---
    "boto3>=1.35.0",
    "openai>=1.50.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "httpx>=0.27.0",           # TestClient transport
]
ocr = [
    "paddlepaddle>=2.6.0",
    "paddleocr>=2.8.0",
]
frontend = [
    "streamlit>=1.38.0",
]

# =============================================================================
# Tool Configuration
# =============================================================================

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["enterprise_ai"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
mypy_path = ["src"]
explicit_package_bases = true
plugins = [
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = [
    "paddleocr.*",
    "paddle.*",
    "google.generativeai.*",
    "pymupdf.*",
    "fitz.*",
]
ignore_missing_imports = true
